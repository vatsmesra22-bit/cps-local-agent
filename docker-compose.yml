# CSP GPS Complaints on a server: dashboard + twice-daily report + nginx in front.
#
#   docker compose up -d --build        # start (or update after git pull)
#   docker compose logs -f report       # watch the report runs
#   docker compose run --rm report python scripts/scheduler.py --once   # build the report now
#
# Settings come from .env (copy .env.example). Data lives in the folders next to this file.

x-app: &app
  build: .
  image: csp-gps:latest
  env_file: .env
  environment:
    CSP_WATCH_FOLDER: /watch          # the shared folder below, as seen inside the container
  user: "${CSP_UID:-1000}:${CSP_GID:-1000}"
  volumes:
    - ./input:/app/input
    - ./output:/app/output
    - ./data:/app/data
    - ./logs:/app/logs
    - ./config:/app/config:ro
    - ${CSP_EXPORTS_DIR:-/srv/csp-exports}:/watch:ro
  restart: unless-stopped

services:
  dashboard:
    <<: *app
    container_name: csp-dashboard
    expose:
      - "8501"

  report:
    <<: *app
    container_name: csp-report
    command: ["python", "scripts/scheduler.py"]
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    container_name: csp-nginx
    depends_on:
      - dashboard
    ports:
      - "${CSP_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
